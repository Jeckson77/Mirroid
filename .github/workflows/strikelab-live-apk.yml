name: Build StrikeLab A55 Live APK

on:
  push:
    branches: [strikelab-live-mvp]
    paths:
      - 'strikelab-live-source.zip'
      - '.github/workflows/strikelab-live-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack source
        run: |
          test -s strikelab-live-source.zip
          mkdir -p StrikeLabLive
          unzip -qo strikelab-live-source.zip -d StrikeLabLive
          test -f StrikeLabLive/settings.gradle
          test -f StrikeLabLive/app/build.gradle
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "${SDKMANAGER%/*}" >> "$GITHUB_PATH"
      - name: Install SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p StrikeLabLive --no-daemon --stacktrace assembleDebug
      - name: Check APK structure
        run: |
          test -s StrikeLabLive/app/build/outputs/apk/debug/app-debug.apk
          unzip -t StrikeLabLive/app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StrikeLab-A55-Live-APK
          path: StrikeLabLive/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
