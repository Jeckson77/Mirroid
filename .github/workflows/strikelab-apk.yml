name: Build StrikeLab A55 APK

on:
  push:
    branches:
      - strikelab-a55-build
    paths:
      - strikelab-source.zip
      - .github/workflows/strikelab-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build and validate Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
      - name: Extract StrikeLab Android project
        shell: bash
        run: |
          mkdir -p StrikeLabA55
          unzip -q strikelab-source.zip -d StrikeLabA55
          test -f StrikeLabA55/settings.gradle
          test -f StrikeLabA55/app/src/main/AndroidManifest.xml
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          test -d "$ANDROID_HOME"
      - name: Install Android 35 SDK
        shell: bash
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        shell: bash
        run: gradle -p StrikeLabA55 --no-daemon --stacktrace assembleDebug
      - name: Validate built APK
        shell: bash
        run: |
          APK=StrikeLabA55/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          ls -lh "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StrikeLabA55-debug-apk
          path: StrikeLabA55/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
