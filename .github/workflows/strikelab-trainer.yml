name: Build StrikeLab A55 Trainer APK
on:
  push:
    branches: [strikelab-a55-build]
    paths:
      - strikelab-trainer-source.zip
      - .github/workflows/strikelab-trainer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract standalone trainer
        shell: bash
        run: |
          mkdir -p StrikeLabTrainer
          unzip -q strikelab-trainer-source.zip -d StrikeLabTrainer
          test -f StrikeLabTrainer/app/build.gradle
          test -f StrikeLabTrainer/app/src/main/java/com/strikelab/trainer/ModelDetector.java
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use SDK manager installed on runner
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "${SDKMANAGER%/*}" >> "$GITHUB_PATH"
      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Get official on-device person detection model
        shell: bash
        run: |
          MODEL=StrikeLabTrainer/app/src/main/assets/efficientdet_lite0.tflite
          curl -fLSs --retry 3 --connect-timeout 25 \
            https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/latest/efficientdet_lite0.tflite \
            -o "$MODEL"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('StrikeLabTrainer/app/src/main/assets/efficientdet_lite0.tflite')
          data=p.read_bytes()
          assert len(data)>1000000 and data[4:8]==b'TFL3', 'Official model download is missing or invalid'
          print('Verified official model bytes:',len(data))
          PY
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle -p StrikeLabTrainer --no-daemon --stacktrace assembleDebug
      - name: Check generated APK
        run: |
          APK=StrikeLabTrainer/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrikeLab-A55-Trainer-v1-APK
          path: StrikeLabTrainer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
